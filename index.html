<title>Mente Estoica</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;600;700&display=swap');

  :root {
    --bg: #161310;
    --bg2: #241d12;
    --gold: #c9a84c;
    --text: #f5f0e1;
    --muted: #8b7d6b;
    --card: #1c1813;
    --card-border: #332a1c;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding-inline: 20px;
    padding-block: 48px;
    background: radial-gradient(ellipse at top, var(--bg2), var(--bg) 60%);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100%;
    display: flex;
    justify-content: center;
  }

  .page {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  .avatar {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold), #8a6f2a);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    box-shadow: 0 10px 30px rgba(201, 168, 76, 0.2);
    border: 2px solid var(--gold);
  }

  .identity {
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .identity h1 {
    margin: 0;
    font-family: 'Cinzel', serif;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 0.5px;
  }

  .identity p {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .link-card {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 16px 18px;
    border-radius: 4px;
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    transition: border-color 0.2s ease, transform 0.15s ease;
  }

  .link-card:hover {
    border-color: var(--gold);
    transform: translateY(-1px);
  }

  .link-card .icon {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    background: rgba(201, 168, 76, 0.12);
  }

  .link-card .meta {
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow: hidden;
  }

  .link-card .meta .sub {
    font-size: 12px;
    color: var(--muted);
    font-weight: 400;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .link-card.primary {
    border-color: var(--gold);
    background: linear-gradient(135deg, rgba(201, 168, 76, 0.14), rgba(201, 168, 76, 0.04));
  }

  .divider {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .divider::before,
  .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--card-border);
  }

  .quote {
    text-align: center;
    font-family: 'Cinzel', serif;
    font-style: italic;
    font-size: 14px;
    color: var(--muted);
    line-height: 1.5;
    padding: 0 10px;
  }

  .footer {
    margin-top: 4px;
    font-family: 'Cinzel', serif;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 2px;
  }
</style>

<div class="page">
  <div class="avatar">🏛️</div>
  <div class="identity">
    <h1>Mente Estoica</h1>
    <p>FILOSOFÍA ESTOICA PARA VIVIR MEJOR</p>
  </div>

  <div class="quote">"La felicidad de tu vida depende de la calidad de tus pensamientos."</div>

  <div class="links">
    <a class="link-card primary" href="https://instagram.com/menteestoica.es" target="_blank" rel="noopener">
      <div class="icon">📸</div>
      <div class="meta">
        <span class="label">Instagram</span>
        <span class="sub">@menteestoica.es</span>
      </div>
    </a>

    <a class="link-card" href="https://tiktok.com/@menteestoica.es" target="_blank" rel="noopener">
      <div class="icon">🎵</div>
      <div class="meta">
        <span class="label">TikTok</span>
        <span class="sub">@menteestoica.es</span>
      </div>
    </a>

    <a class="link-card" href="https://facebook.com/profile.php?id=1267486686458600" target="_blank" rel="noopener">
      <div class="icon">👍</div>
      <div class="meta">
        <span class="label">Facebook</span>
        <span class="sub">Mente Estoica</span>
      </div>
    </a>

    <div class="divider">También seguinos</div>

    <a class="link-card" href="https://instagram.com/thebusinessminds.es" target="_blank" rel="noopener">
      <div class="icon">🧠</div>
      <div class="meta">
        <span class="label">The Business Mind</span>
        <span class="sub">Negocios y emprendimiento</span>
      </div>
    </a>
  </div>

  <div class="footer">MENTE ESTOICA</div>
</div>
